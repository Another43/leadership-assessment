<!DOCTYPE html>
<html lang="en" dir="ltr" class="sl-theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspirational Leadership — Self-Assessment | Global Leadership Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,18..72,400;0,18..72,500;1,18..72,400&family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Shoelace: theme + the components this app uses.
     The stylesheet is pinned with an SRI hash. The component modules below cannot be — SRI has
     no effect on dynamic import() — so a compromised CDN could still run script here. Self-host
     the seven modules alongside this file if that risk matters for where it's published. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css"
      integrity="sha384-VNjXcWTFgkXi1VXtuRlXBLNB44AvISAfti9WbOPCBCiNPnUpJ6dHx1Y3XmTii9pB"
      crossorigin="anonymous">
<script type="module">
  const SL = "https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/";
  try {
  await Promise.all([
    "components/button/button.js",
    "components/select/select.js",
    "components/option/option.js",
    "components/radio-group/radio-group.js",
    "components/radio-button/radio-button.js",
    "components/card/card.js",
    "components/tag/tag.js",
    "components/progress-bar/progress-bar.js"
  ].map(p => import(SL + p)));
  document.documentElement.classList.add("sl-ready");
  } catch (e) {
    // Blocked, offline, or the CDN is down. Tell the app so it can render native controls
    // instead of leaving a page of invisible buttons.
    window.dispatchEvent(new Event("sl-failed"));
  }
</script>

<style>
  /* ============================================================
     GLOBAL LEADERSHIP PARTNERS — brand tokens
     Swap these six hex values for the official brand palette.
     ============================================================ */
  :root{
    --navy:#16263F;     /* brand anchor: headings, structure, hero card */
    --brand-blue:#1A3C6B;/* GLP header blue (matches their site bar)     */
    --royal:#25548A;    /* primary interactive blue: selections, bars    */
    --gold-brand:#F0C415;/* true GLP gold (logo, header rule) on dark    */
    --gold:#C99A3A;     /* contrast-safe gold for fills on light (wedges)*/
    --gold-deep:#856518;/* gold for text on light backgrounds (AA-safe) */
    --ground:#F2F5FA;   /* page background: cool paper                  */
    --surface:#FFFFFF;  /* cards                                        */

    --ink:#1A2433;
    --muted:#566273;
    --line:#DCE3EE;
    --line-soft:#EAEFF6;

    --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --sans:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

    --maxw:1200px;
    --radius:14px;
    --shadow:0 1px 2px rgba(22,38,63,.04), 0 12px 30px -18px rgba(22,38,63,.22);

    /* ---- Shoelace, re-themed to the brand ---- */
    --sl-font-sans:var(--sans);
    --sl-color-primary-50:#eef3f9;
    --sl-color-primary-100:#d6e1ef;
    --sl-color-primary-200:#b0c5dd;
    --sl-color-primary-300:#84a4c8;
    --sl-color-primary-400:#5681b0;
    --sl-color-primary-500:#356391;
    --sl-color-primary-600:#25548A;  /* royal — main */
    --sl-color-primary-700:#1f456f;
    --sl-color-primary-800:#1b3a5c;
    --sl-color-primary-900:#16263F;  /* navy */
    --sl-color-primary-950:#0f1c30;
    --sl-border-radius-small:8px;
    --sl-border-radius-medium:11px;
    --sl-border-radius-large:14px;
    --sl-focus-ring-color:rgba(201,154,58,.45);
    --sl-focus-ring-width:3px;
    --sl-input-font-size-medium:16px;
  }

  /* Per-script font swap. A locale sets <body data-script="…">. */
  body[data-script="arabic"]{
    --serif:"Amiri","Noto Naskh Arabic","Times New Roman",serif;
    --sans:"Noto Sans Arabic","Tajawal",system-ui,sans-serif;
  }

  /* Hide Shoelace elements until their definitions load (no FOUC) */
  sl-radio-group:not(:defined),
  sl-radio-button:not(:defined),
  sl-button:not(:defined),
  sl-select:not(:defined),
  sl-tag:not(:defined),
  sl-card:not(:defined){visibility:hidden}

  /* Shoelace is served from a CDN. If it never arrives, the rule above would leave every
     button invisible with no explanation, so .sl-fallback un-hides what still works and the
     script swaps the rating scale for native radios. See enterFallback(). */
  .sl-fallback sl-button:not(:defined),
  .sl-fallback sl-tag:not(:defined){visibility:visible}
  .sl-fallback sl-button:not(:defined){
    display:inline-block;cursor:pointer;border:1.5px solid var(--line);border-radius:11px;
    background:var(--surface);color:var(--navy);padding:12px 22px;font-weight:600;font-size:15px;
  }
  .sl-fallback sl-button:not(:defined)[variant="primary"]{background:var(--royal);color:#fff;border-color:var(--royal)}
  .sl-fallback sl-button:not(:defined)[disabled]{opacity:.45;cursor:not-allowed}
  .sl-fallback sl-button:not(:defined) svg{display:none}
  .sl-fallback .langpick,
  .sl-fallback sl-progress-bar:not(:defined){display:none}

  /* Native rating scale — only rendered when Shoelace is unavailable. */
  .nativescale{display:flex;gap:8px;width:100%;margin-top:14px}
  .nativescale .nb{flex:1 1 0;position:relative}
  .nativescale input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .nativescale .nb span{
    display:block;text-align:center;padding:14px 0;border:1.5px solid var(--line);border-radius:11px;
    background:var(--surface);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;
  }
  .nativescale input:checked + span{background:var(--royal);border-color:var(--royal);color:#fff}
  .nativescale input:focus-visible + span{outline:3px solid var(--gold-deep);outline-offset:2px}
  fieldset.scalegrp{border:0;margin:0;padding:0;min-width:0}
  fieldset.scalegrp > legend{padding:0}

  /* Available to screen readers, never shown. Carries the scale anchor onto each numeral. */
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  .printdate{display:none}

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--sans);font-weight:400;line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  ::selection{background:rgba(201,154,58,.28)}

  /* ---------- sticky brand bar ---------- */
  .brandbar{position:sticky;top:0;z-index:50;background:var(--brand-blue);color:#fff;border-bottom:2.5px solid var(--gold-brand)}
  .brandbar-inner{max-width:var(--maxw);margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .wordmark{display:flex;align-items:center;gap:10px;min-width:0}
  .glp-logo{height:42px;width:auto;display:block;flex:none}

  .langpick{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.85)}
  .langpick svg{flex:none;opacity:.8}
  sl-select.lang{width:auto;min-width:148px}
  sl-select.lang::part(combobox){
    background-color:transparent;color:#fff;
    border-color:rgba(255,255,255,.28);border-radius:8px;
  }
  sl-select.lang::part(display-input){color:#fff;font-size:12.5px}
  sl-select.lang::part(expand-icon){color:rgba(255,255,255,.8)}

  /* ---------- layout / screens ---------- */
  main{max-width:var(--maxw);margin:0 auto;padding:0 22px 96px}
  .screen{display:none}
  .screen.active{display:block}

  /* ---------- intro ---------- */
  .hero{padding:60px 0 8px}
  .hero-aside{margin-top:6px}
  @media(min-width:900px){
    .hero{display:grid;grid-template-columns:1.1fr .9fr;column-gap:56px;grid-template-areas:"copy aside" "cta aside";align-items:start;padding:80px 0 44px}
    .hero-copy{grid-area:copy}
    .hero-copy .lede{margin-bottom:0}
    .hero-aside{grid-area:aside;align-self:center;margin-top:0}
    .hero-aside .legend{margin-bottom:0}
    .hero-cta{grid-area:cta;margin-top:24px}
  }
  .eyebrow{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--gold-deep);margin:0 0 18px}
  .hero h1{font-family:var(--serif);font-weight:400;color:var(--navy);font-size:clamp(40px,8vw,68px);line-height:1.02;letter-spacing:-.015em;margin:0 0 14px}
  .hero .lede{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:clamp(18px,2.6vw,22px);line-height:1.4;margin:0 0 30px;max-width:34ch}
  .legend{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:30px}
  .legend p{margin:0 0 16px;font-size:14.5px;color:var(--ink)}
  .legend p b{color:var(--navy)}
  .scalekey{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .scalekey .k{flex:1;text-align:center;padding:9px 6px;font-size:11px;color:var(--muted);border-inline-end:1px solid var(--line-soft);background:#fff}
  .scalekey .k:last-child{border-inline-end:0}
  .scalekey .k b{display:block;font-size:15px;color:var(--navy);font-weight:600;margin-bottom:2px;font-variant-numeric:tabular-nums}
  .scalekey .k.lo b{color:var(--royal)}
  .scalekey .k.hi b{color:var(--gold-deep)}

  /* ---------- shared stage ---------- */
  .stage{padding:30px 0 0}

  /* ---------- wizard body ---------- */
  #wizardBody,#resultsBody{max-width:940px;margin:0 auto}
  .wizhead{text-align:center;margin:2px 0 18px}
  sl-progress-bar#prog{--height:6px;--track-color:var(--line-soft);--indicator-color:var(--royal);display:block;max-width:520px;margin:0 auto 14px;border-radius:4px}
  .nav-restart{text-align:center;margin-top:16px}
  #restartBtn::part(base){color:var(--muted)}
  #screen-language .lang-land{max-width:560px;margin:0 auto;padding:clamp(48px,10vh,96px) 0 60px;text-align:center}
  .lang-prompt{font-family:var(--serif);font-weight:400;color:var(--navy);font-size:clamp(24px,4vw,34px);margin:0 0 30px}
  .lang-choices{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:0 auto}
  .lang-btn::part(base){width:100%;justify-content:center}
  .step-label{
    display:inline-block;margin:0;font-family:var(--sans);
    font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-deep);
  }
  /* Focus lands here after each page change so keyboard and screen reader users are moved to
     the new questions instead of being stranded on the Continue button. */
  .step-label:focus{outline:none}
  .step-label:focus-visible{outline:2px solid var(--gold-deep);outline-offset:5px;border-radius:3px}
  .navnote{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 0;min-height:1.2em}

  .q{padding:22px 0;border-bottom:1px solid var(--line-soft)}
  .q:last-of-type{border-bottom:0}
  .q-text{display:block;font-size:16px;color:var(--ink);line-height:1.45;margin-bottom:2px}
  .q-text .q-n{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;margin-inline-end:8px}

  sl-radio-group.scalegrp{width:100%}
  sl-radio-group.scalegrp::part(form-control-label){margin-bottom:14px}
  sl-radio-group.scalegrp::part(button-group){width:100%}
  sl-radio-group.scalegrp::part(button-group__base){display:flex;gap:8px}
  .scalegrp sl-radio-button{flex:1 1 0}
  .scalegrp sl-radio-button::part(button){
    width:100%;border-radius:11px;border-width:1.5px;
    font-variant-numeric:tabular-nums;font-weight:600;
    padding-top:14px;padding-bottom:14px;
  }
  .scalegrp sl-radio-button::part(label){padding:0}
  .scale-ends{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:11.5px;color:var(--muted);margin-top:9px;padding:0 2px}
  .scale-ends span:first-child{text-align:start}
  .scale-ends .mid{text-align:center}
  .scale-ends span:last-child{text-align:end}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:30px 0 0}
  .nav .spacer{flex:1}

  /* ---------- results body ---------- */
  .results-head{text-align:center;padding:6px 0 2px;margin-top:30px}
  .results-head .eyebrow{color:var(--gold-deep)}
  .results-head h2{font-family:var(--serif);font-weight:400;color:var(--navy);font-size:clamp(28px,5.4vw,42px);margin:0;letter-spacing:-.01em}

  .breakdown{display:grid;gap:2px;margin:14px 0 4px}
  .brk{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line-soft)}
  .brk:last-child{border-bottom:0}
  .brk-main{min-width:0}
  .brk-name{font-family:var(--serif);font-size:18px;color:var(--navy);font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  sl-tag.tag::part(base){border:0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 9px}
  sl-tag.s-strength::part(base){background:rgba(201,154,58,.16);color:var(--gold-deep)}
  sl-tag.s-growth::part(base){background:var(--line-soft);color:var(--muted)}
  .brk-desc{font-size:13px;color:var(--muted);margin-top:3px}
  .brk-bar{height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-top:10px}
  .brk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--royal),#3a6fae);border-radius:4px;width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
  .brk-val{font-family:var(--serif);font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
  .brk-val .den{color:var(--muted);font-size:15px}


  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}

  footer{max-width:var(--maxw);margin:0 auto;padding:34px 22px 60px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.6}
  footer p{max-width:78ch;margin:0 0 10px}
  footer b{color:var(--navy)}

  /* ---------- RTL ---------- */
  [dir="rtl"] .eyebrow,[dir="rtl"] .step-label,
  [dir="rtl"] .hero h1,[dir="rtl"] .results-head h2,
  [dir="rtl"] .brk-val,[dir="rtl"] .brk-name .n{letter-spacing:normal}

  /* ---------- responsive ---------- */
  @media (max-width:560px){
    .scalegrp sl-radio-button::part(button){padding-top:12px;padding-bottom:12px}
    .scalegrp sl-radio-group::part(button-group__base){gap:6px}
    .glp-logo{height:34px}
    .hero{padding:44px 0 6px}
  }
  @media (max-width:400px){ .glp-logo{height:30px} }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{transition:none !important}
  }

  /* ---------- print ---------- */
  @media print{
    .wizhead,.nav,.nav-restart,.actions,.langpick,#screen-intro,#screen-language{display:none !important}
    body{background:#fff}
    /* The wordmark is white and gold on transparency, so it only reads against its blue
       backing — keep the bar rather than handing someone an unbranded sheet. Browsers drop
       background colour when printing unless told otherwise, which would also have left
       every score bar blank on the one output this tool has. */
    .brandbar{position:static}
    .brandbar,.brk-bar,.brk-bar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .printdate{display:block;text-align:center;color:var(--muted);font-size:12px;margin:6px 0 0}
    .brk{break-inside:avoid}
  }
</style>
</head>

<main>
  <!-- LANGUAGE LANDING -->
  <section class="screen active" id="screen-language">
    <div class="lang-land">
      <p class="lang-prompt" id="langPrompt"></p>
      <div class="lang-choices" id="langChoices"></div>
    </div>
  </section>

  <!-- INTRO -->
  <section class="screen" id="screen-intro">
    <div class="hero">
      <div class="hero-copy">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="heroTitle"></h1>
        <p class="lede" id="heroLede"></p>
      </div>
      <div class="hero-aside">
        <div class="legend">
          <p id="legendText"></p>
          <div class="scalekey" id="scaleKey" aria-hidden="true"></div>
        </div>
      </div>
      <div class="hero-cta">
        <sl-button variant="primary" size="large" id="beginBtn"></sl-button>
      </div>
    </div>
  </section>

  <!-- STAGE: wizard + results -->
  <section class="screen" id="screen-stage">
    <div class="stage" id="stage">

      <!-- WIZARD BODY -->
      <div id="wizardBody">
        <div class="wizhead">
          <sl-progress-bar id="prog" value="0"></sl-progress-bar>
          <h2 class="step-label" id="stepLabel" tabindex="-1"></h2>
        </div>
        <div id="statements"></div>
        <div class="nav">
          <sl-button id="backBtn" variant="default"></sl-button>
          <span class="spacer"></span>
          <sl-button id="nextBtn" variant="primary"></sl-button>
        </div>
        <p class="navnote" id="navNote" role="status" aria-live="polite"></p>
        <div class="nav-restart">
          <sl-button id="restartBtn" variant="text" size="small"></sl-button>
        </div>
      </div>

      <!-- RESULTS BODY -->
      <div id="resultsBody" style="display:none">
        <div class="results-head">
          <p class="eyebrow" id="resultsEyebrow"></p>
          <h2 id="resultsTitle"></h2>
          <p class="printdate" id="printDate"></p>
        </div>
        <div class="breakdown" id="breakdown"></div>
        <div class="actions">
          <sl-button id="printBtn" variant="default"></sl-button>
        </div>
      </div>
    </div>
  </section>
</main>

function dims(){ return L().dimensions||LOCALES[FALLBACK].dimensions; }

function frac(n,d){ return '<span dir="ltr">'+nf(n)+'<span class="den">/'+nf(d)+'</span></span>'; }

/* scoring (per dimension) */
const dimScore=(di)=>answers[di].reduce((s,x)=>s+(x||0),0);
const answeredCount=()=>answers.flat().filter(x=>x!==null).length;

/* ================================================================
   QUESTION PAGING
   The 30 statements are shuffled across pages with no more than two
   from any one dimension per page. Each answer still records against
   its dimension, so results break down by dimension as before, while
   a page no longer maps to a single theme.
   ================================================================ */
const PAGE_SIZE=5;
const PAGE_COUNT=Math.ceil(TOTAL/PAGE_SIZE);
let pages=[];   // each entry: array of {d,q}
let pageIx=0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0, t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function buildPages(){
  const items=[];
  for(let d=0; d<DIMS; d++) for(let q=0; q<PER; q++) items.push({d,q});
  for(let attempt=0; attempt<300; attempt++){
    const bag=shuffle(items.slice());
    const pg=Array.from({length:PAGE_COUNT},()=>[]);
    const cnt=Array.from({length:PAGE_COUNT},()=>({}));
    let ok=true;
    for(const it of bag){
      const cand=[];
      for(let p=0;p<PAGE_COUNT;p++){ if(pg[p].length<PAGE_SIZE && (cnt[p][it.d]||0)<2) cand.push(p); }
      if(!cand.length){ ok=false; break; }
      cand.sort((a,b)=>pg[a].length-pg[b].length);   // fill the emptiest valid page
      const p=cand[0];
      pg[p].push(it); cnt[p][it.d]=(cnt[p][it.d]||0)+1;
    }
    if(ok && pg.every(p=>p.length===PAGE_SIZE)){ pages=pg.map(p=>shuffle(p)); return; }
  }
  // deterministic fallback for the 6x5 shape: dimension d is absent from page d
  const pg=Array.from({length:PAGE_COUNT},()=>[]);
  for(let d=0; d<DIMS; d++){
    const qs=shuffle(Array.from({length:PER},(_,q)=>q)); let k=0;
    for(let p=0;p<PAGE_COUNT;p++){ if(p===d) continue; if(k<qs.length) pg[p].push({d,q:qs[k++]}); }
  }
  pages=pg.map(p=>shuffle(p));
}
const pageComplete=(p)=>pages[p].every(it=>answers[it.d][it.q]!==null);

function renderPage(){
  const key=ui("scaleKey"), page=pages[pageIx];
  setText("stepLabel", fmt(ui("partOf"),{n:nf(pageIx+1),total:nf(PAGE_COUNT)}));
  $("restartBtn").textContent=ui("reset");
  let html="";
  page.forEach((it,i)=>{
    const text=dims()[it.d].items[it.q], v=answers[it.d][it.q];
    const label='<span class="q-n">'+nf(i+1)+'.</span>'+esc(text);
    const data=' data-d="'+it.d+'" data-q="'+it.q+'"';
    if(slLoaded()){
      html+='<div class="q">'+
        '<sl-radio-group class="scalegrp"'+data+(v!==null?' value="'+v+'"':'')+'>'+
          '<span slot="label" class="q-text">'+label+'</span>';
      // The visible face of each option is a bare numeral; the anchor rides along in the
      // accessible name so the scale isn't just "1, 2, 3, 4, 5" to a screen reader.
      for(let val=1;val<=5;val++){
        html+='<sl-radio-button value="'+val+'">'+nf(val)+
              '<span class="sr-only"> — '+esc(key[val-1])+'</span></sl-radio-button>';
      }
      html+='</sl-radio-group>';
    }else{
      const name="q"+it.d+"_"+it.q;
      html+='<div class="q">'+
        '<fieldset class="scalegrp"'+data+'>'+
          '<legend class="q-text">'+label+'</legend>'+
          '<div class="nativescale">';
      for(let val=1;val<=5;val++){
        html+='<label class="nb"><input type="radio" name="'+name+'" value="'+val+'"'+
              (v===val?' checked':'')+' aria-label="'+esc(nf(val)+" — "+key[val-1])+'">'+
              '<span>'+nf(val)+'</span></label>';
      }
      html+='</div></fieldset>';
    }
    html+='<div class="scale-ends" aria-hidden="true"><span>'+esc(key[0])+'</span>'+
          '<span class="mid">'+esc(key[2])+'</span><span>'+esc(key[4])+'</span></div>'+
    '</div>';
  });
  $("statements").innerHTML=html;
  $("statements").querySelectorAll(".scalegrp").forEach(g=>{
    const record=(val)=>{ answers[Number(g.dataset.d)][Number(g.dataset.q)]=Number(val); updateNav(); };
    g.addEventListener("sl-change",()=>record(g.value));
    g.addEventListener("change",e=>{ if(e.target.matches('input[type="radio"]')) record(e.target.value); });
  });
  updateNav();
}
function updateNav(){
  const prog=$("prog");
  if(prog) prog.value=Math.round(answeredCount()/TOTAL*100);
  const back=$("backBtn"), next=$("nextBtn");
  back.innerHTML=ARROW.back+esc(ui("back"));
  const last=pageIx===PAGE_COUNT-1;
  next.innerHTML=esc(last?ui("reveal"):ui("next"))+(last?ARROW.down:ARROW.fwd);
  const done=pageComplete(pageIx);
  next.toggleAttribute("disabled", !done);
  // A disabled button explains nothing, and isn't focusable, so assistive tech never learns
  // why it can't continue. Say what is outstanding instead.
  const left=pages[pageIx].filter(it=>answers[it.d][it.q]===null).length;
  setText("navNote", done ? "" : fmt(ui("remaining."+plurals[activeCode].select(left)) ?? ui("remaining.other"), {n:nf(left)}));
}
function goPage(i){

  $("stepLabel").focus({preventScroll:true});

function onBack(){ if(pageIx===0){ goIntro(); } else { goPage(pageIx-1); } }
function onNext(){ if(pageIx===PAGE_COUNT-1){ gotoResults(); } else { goPage(pageIx+1); } }

  if(L().numbering) dOpts.numberingSystem=L().numbering;
  setText("printDate", new Date().toLocaleDateString(L().numLocale||activeCode, dOpts));
  renderBreakdown();

function renderBreakdown(){
  // Sorted high -> low: top two are relative strengths, the next two growth opportunities,
  // and the bottom two are deliberately left unlabelled.
  //
  // Tags key off the score VALUE, not the rank. Six sums drawn from 5..25 tie constantly, and
  // ranking alone would split tied dimensions by declaration order — telling one leader that
  // Dream Big is a strength and Show Care a growth area purely because of the order the
  // dimensions happen to be listed in. So a tie at the top widens the strength group, and a tie
  // reaching the lowest score drops the growth tag rather than labelling a dimension this design
  // means to leave silent.
  const order=dims().map((_,di)=>di).sort((a,b)=>dimScore(b)-dimScore(a));
  const ranked=order.map(dimScore);
  const strengthCut=ranked[1], growthCut=ranked[3], lowest=ranked[DIMS-1];
  const level=ranked.filter(s=>s>=strengthCut).length>=DIMS-1;   // nothing meaningfully on top
  const tagStrength=' <sl-tag class="tag s-strength" size="small" pill>'+esc(ui("relStrength"))+'</sl-tag>';
  const tagGrowth  =' <sl-tag class="tag s-growth"   size="small" pill>'+esc(ui("growthLabel"))+'</sl-tag>';
  let html="";
  order.forEach(di=>{
    const dim=dims()[di], sc=dimScore(di);
    let tag="";
    if(!level){
      if(sc>=strengthCut)                 tag=tagStrength;
      else if(sc>=growthCut && sc>lowest) tag=tagGrowth;
    }
    // A dimension scores 5..25, never 0..25, so scale the bar to the achievable range —
    // otherwise answering 1 to everything still draws six bars a fifth full. The fraction
    // beside it stays the raw score, which is what carries across sessions.
    const pct=(sc-MINDIM)/(MAXDIM-MINDIM)*100;
    html+='<div class="brk"><div class="brk-main">'+
      '<div class="brk-name">'+esc(dim.title)+tag+'</div>'+
      (dim.desc?'<div class="brk-desc">'+esc(dim.desc)+'</div>':'')+
      '<div class="brk-bar"><i data-w="'+pct+'"></i></div>'+
      '</div><div class="brk-val">'+frac(sc,MAXDIM)+'</div></div>';
  });
  $("breakdown").innerHTML=html;
}

/* ================================================================
   APPLY LOCALE
   ================================================================ */
function applyLocale(code){
  if(!LOCALES[code]) code=FALLBACK;
  activeCode=code;
  const loc=L(), y=scrollY;
  document.documentElement.lang=code;
  document.documentElement.dir=loc.dir;
  // Built from copy that is already translated — the tab, and the header of any printed
  // PDF, otherwise stayed English no matter which language was chosen.
  document.title=ui("heroEyebrow")+" — Global Leadership Partners";
  document.body.dataset.script=loc.script||"latin";
  const sel=$("lang");
  if(sel){
    if(customElements.get("sl-select")){ (sel.updateComplete||Promise.resolve()).then(()=>{ sel.value=code; }); }
    else{ sel.setAttribute("value", code); }
  }
  setText("langPrompt", ui("langChoose"));
  renderIntro();
  if(phase==="wizard") renderPage();
  if(phase==="results"){
    renderResultsStatic();
    document.querySelectorAll(".brk-bar i").forEach(i=>i.style.width=i.dataset.w+"%");
  }
  scrollTo({top:y, behavior:"auto"});
}

/* ================================================================
   INIT
   ================================================================ */
function detectInitial(){
  const navs=navigator.languages||[navigator.language||"en"];
  for(const n of navs){ const b=n.toLowerCase().split("-")[0]; if(LOCALES[b]) return b; }
  return "en";
}

/* Shoelace loads from a CDN, and `:not(:defined){visibility:hidden}` means a failed load
   would otherwise leave a page of invisible buttons with nothing to click and no error.
   Fall back to native controls instead: the rating scale becomes real radio inputs, and the
   buttons stay clickable because their handlers are bound to the elements themselves. */
function slLoaded(){ return !!customElements.get("sl-radio-group"); }
function enterFallback(){
  const root=document.documentElement;
  if(root.classList.contains("sl-fallback")||slLoaded()) return;
  root.classList.add("sl-fallback");
  if(phase==="wizard") renderPage();
}
addEventListener("sl-failed", enterFallback);
setTimeout(enterFallback, 5000);   // covers a hung request, which never rejects

buildLangPicker();
buildLangButtons();
$("beginBtn").addEventListener("click", startWizard);
$("backBtn").addEventListener("click", onBack);
$("nextBtn").addEventListener("click", onNext);
$("restartBtn").addEventListener("click", restart);
$("printBtn").addEventListener("click", ()=>window.print());
applyLocale(detectInitial());
showScreen("language");
</script>
